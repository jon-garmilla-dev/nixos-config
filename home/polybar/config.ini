[colors]
background = #000000
background-alt = #141414
foreground = #ffffff
primary = #ffffff
disabled = #444444

[bar/main]
width = 100%
height = 14
dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}
border-bottom-size = 1
border-bottom-color = #1a1a1a

padding-left = 0
padding-right = 1
module-margin = 0

separator = " | "
separator-foreground = ${colors.disabled}

font-0 = "JetBrainsMono Nerd Font:size=7;1"

modules-left = bspwm
modules-center = date
modules-right = filesystem cpu memory network

cursor-click = pointer
enable-ipc = true
wm-restack = bspwm

[module/bspwm]
type = internal/bspwm

label-focused = %name%
label-focused-background = ${colors.background-alt}
label-focused-underline = ${colors.primary}
label-focused-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = #ff5555
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/date]
type = internal/date
interval = 1.0
date = %Y-%m-%d
time = %H:%M:%S
label = %date%  %time%
label-foreground = ${colors.primary}

[module/filesystem]
type = internal/fs
mount-0 = /
interval = 30
format-mounted = SSD <label-mounted>%
label-mounted = %percentage_used%
format-mounted-foreground = ${colors.primary}

[module/cpu]
type = internal/cpu
interval = 2
format = CPU <label>%
label = %percentage%
format-foreground = ${colors.primary}

[module/memory]
type = internal/memory
interval = 2
format = RAM <label>
label = %gb_used%
format-foreground = ${colors.primary}

[module/network]
type = internal/network
interface-type = wired
interval = 3.0
label-connected = IP %local_ip%
label-connected-foreground = ${colors.primary}
label-disconnected = NO RED
label-disconnected-foreground = ${colors.disabled}
